[flake8]
# только wemake-python-styleguide: pycodestyle и pyflakes пересекаются с ruff, он остаётся основным линтером
select = WPS
max-line-length = 120
exclude = .git, __pycache__, .ruff_cache, .venv
# Игноры только для тестов — стандартные конвенции unittest; у скриптов и пакета crossreview их нет.
# WPS118 длинные имена: имя теста — русская фраза о проверяемом поведении.
# WPS202 члены модуля: модуль тестов одного скрипта держит все его TestCase и их фикстуры.
# WPS214 методы класса: TestCase — это набор test-методов и общих для них хелперов.
# WPS226 повтор строк: ожидаемые выводы, id и имена файлов намеренно повторяются от теста к тесту.
# WPS432 «магические» числа: ожидаемые счётчики, коды выхода и confidence — это и есть проверки.
per-file-ignores =
    skills/cross-review/scripts/tests/*.py: WPS118, WPS202, WPS214, WPS226, WPS432
